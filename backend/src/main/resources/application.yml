server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: ocean-weather-api
  jackson:
    default-property-inclusion: non_null
open-meteo:
  weather-url: https://api.open-meteo.com/v1/forecast
  marine-url: https://marine-api.open-meteo.com/v1/marine
  timeout-seconds: 8
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
